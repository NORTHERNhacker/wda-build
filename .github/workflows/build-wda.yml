name: Build WDA IPA
on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent git tag to build'
        required: true
        default: 'v4.10.24'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Pick Xcode with max iOS-14 runtime compat
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | head -1); fi
          echo "Using $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Clone WebDriverAgent
        run: git clone --depth 1 --branch ${{ github.event.inputs.wda_tag }} https://github.com/appium/WebDriverAgent.git

      - name: Build for iOS device (signing disabled)
        run: |
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CFLAGS="-Wno-error -Wno-missing-noescape"

      - name: Package unsigned IPA (proper Payload layout)
        run: |
          APP_PATH=$(find ./DerivedData -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -q -r WDA-unsigned.ipa Payload
          ls -la WDA-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDA-unsigned-ipa
          path: WDA-unsigned.ipa
